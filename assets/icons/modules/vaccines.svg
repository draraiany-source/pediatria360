<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"
     width="96" height="96" role="img" aria-label="vaccines">
  <defs>
    <linearGradient id="body-vaccines" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2FA37D"/>
      <stop offset="100%" stop-color="#0E6E52"/>
    </linearGradient>
    <linearGradient id="gloss-vaccines" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop-vaccines" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5"
                    flood-color="#0E6E52" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="10" y="8" width="76" height="76" rx="22"
        fill="url(#body-vaccines)" filter="url(#drop-vaccines)"/>
  <rect x="10" y="8" width="76" height="38" rx="22"
        fill="url(#gloss-vaccines)"/>
  <g transform="rotate(-45 48 46)">
    <rect x="44" y="24" width="8" height="30" rx="3" fill="#0B3A42"
          fill-opacity="0.3" transform="translate(0,3)"/>
    <rect x="44" y="24" width="8" height="30" rx="3" fill="#FFFFFF"/>
    <rect x="41" y="52" width="14" height="8" rx="2" fill="#FFFFFF"
          fill-opacity="0.85"/>
    <rect x="47" y="60" width="2" height="10" fill="#FFFFFF"/>
  </g>
</svg>
