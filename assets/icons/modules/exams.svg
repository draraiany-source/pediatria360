<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"
     width="96" height="96" role="img" aria-label="exams">
  <defs>
    <linearGradient id="body-exams" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22B8D6"/>
      <stop offset="100%" stop-color="#0E6E82"/>
    </linearGradient>
    <linearGradient id="gloss-exams" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop-exams" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5"
                    flood-color="#0E6E82" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="10" y="8" width="76" height="76" rx="22"
        fill="url(#body-exams)" filter="url(#drop-exams)"/>
  <rect x="10" y="8" width="76" height="38" rx="22"
