      <stop offset="0%" stop-color="#D45C86"/>
      <stop offset="100%" stop-color="#9C2A54"/>
    </linearGradient>
    <linearGradient id="gloss-shop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
