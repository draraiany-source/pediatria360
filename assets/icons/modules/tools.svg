<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"
     width="96" height="96" role="img" aria-label="tools">
  <defs>
    <linearGradient id="body-tools" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8595AB"/>
      <stop offset="100%" stop-color="#4A5568"/>
    </linearGradient>
    <linearGradient id="gloss-tools" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop-tools" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5"
                    flood-color="#4A5568" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="10" y="8" width="76" height="76" rx="22"
        fill="url(#body-tools)" filter="url(#drop-tools)"/>
  <rect x="10" y="8" width="76" height="38" rx="22"
        fill="url(#gloss-tools)"/>
  <rect x="30" y="26" width="36" height="46" rx="6" fill="#0B3A42"
        fill-opacity="0.3" transform="translate(0,3)"/>
  <rect x="30" y="26" width="36" height="46" rx="6" fill="#FFFFFF"/>
  <rect x="36" y="32" width="24" height="10" rx="2" fill="#4A5568"
        fill-opacity="0.35"/>
  <circle cx="40" cy="52" r="3.5" fill="#4A5568" fill-opacity="0.6"/>
  <circle cx="52" cy="52" r="3.5" fill="#4A5568" fill-opacity="0.6"/>
  <circle cx="40" cy="63" r="3.5" fill="#4A5568" fill-opacity="0.6"/>
  <circle cx="52" cy="63" r="3.5" fill="#4A5568" fill-opacity="0.6"/>
</svg>
