<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"
     width="96" height="96" role="img" aria-label="medications">
  <defs>
    <linearGradient id="body-medications" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9B7FE0"/>
      <stop offset="100%" stop-color="#5B3FA8"/>
    </linearGradient>
    <linearGradient id="gloss-medications" x1="0" y1="0" x2="0" y2="1">
