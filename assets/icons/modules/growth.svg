<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"
     width="96" height="96" role="img" aria-label="growth">
  <defs>
    <linearGradient id="body-growth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FA8B8"/>
      <stop offset="100%" stop-color="#2E7D8A"/>
    </linearGradient>
    <linearGradient id="gloss-growth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop-growth" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5"
                    flood-color="#2E7D8A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="10" y="8" width="76" height="76" rx="22"
        fill="url(#body-growth)" filter="url(#drop-growth)"/>
  <rect x="10" y="8" width="76" height="38" rx="22"
        fill="url(#gloss-growth)"/>
  <path d="M30 62 L44 48 L54 56 L68 38" stroke="#0B3A42"
        stroke-opacity="0.35" stroke-width="6" fill="none"
        stroke-linecap="round" stroke-linejoin="round"
        transform="translate(0,3)"/>
  <path d="M30 62 L44 48 L54 56 L68 38" stroke="#FFFFFF" stroke-width="6"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="68" cy="38" r="6" fill="#0B3A42" fill-opacity="0.3"
          transform="translate(0,3)"/>
  <circle cx="68" cy="38" r="6" fill="#FFFFFF"/>
</svg>
