<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"
     width="96" height="96" role="img" aria-label="agenda">
  <defs>
    <linearGradient id="body-agenda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#B36A00"/>
    </linearGradient>
    <linearGradient id="gloss-agenda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop-agenda" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5"
                    flood-color="#B36A00" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="10" y="8" width="76" height="76" rx="22"
        fill="url(#body-agenda)" filter="url(#drop-agenda)"/>
  <rect x="10" y="8" width="76" height="38" rx="22"
        fill="url(#gloss-agenda)"/>
  <rect x="27" y="32" width="42" height="36" rx="6" fill="#0B3A42"
        fill-opacity="0.3" transform="translate(0,3)"/>
  <rect x="27" y="32" width="42" height="36" rx="6" fill="#FFFFFF"/>
  <rect x="34" y="26" width="4" height="10" rx="2" fill="#FFFFFF"/>
  <rect x="58" y="26" width="4" height="10" rx="2" fill="#FFFFFF"/>
  <rect x="27" y="32" width="42" height="10" rx="4" fill="#B36A00"
        fill-opacity="0.55"/>
  <circle cx="48" cy="55" r="6" fill="#B36A00" fill-opacity="0.55"/>
</svg>
