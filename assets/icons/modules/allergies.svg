<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"
     width="96" height="96" role="img" aria-label="allergies">
  <defs>
    <linearGradient id="body-allergies" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF5A4C"/>
      <stop offset="100%" stop-color="#A8241A"/>
    </linearGradient>
    <linearGradient id="gloss-allergies" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop-allergies" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5"
                    flood-color="#A8241A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="10" y="8" width="76" height="76" rx="22"
        fill="url(#body-allergies)" filter="url(#drop-allergies)"/>
  <rect x="10" y="8" width="76" height="38" rx="22"
        fill="url(#gloss-allergies)"/>
  <path d="M48 26 L72 66 L24 66 Z" fill="none" stroke="#0B3A42"
        stroke-opacity="0.3" stroke-width="6" stroke-linejoin="round"
        transform="translate(0,3)"/>
  <path d="M48 26 L72 66 L24 66 Z" fill="none" stroke="#FFFFFF"
        stroke-width="6" stroke-linejoin="round"/>
  <rect x="45" y="42" width="6" height="14" rx="3" fill="#FFFFFF"/>
  <circle cx="48" cy="60" r="3.5" fill="#FFFFFF"/>
