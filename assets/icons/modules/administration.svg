    <filter id="drop-administration" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5"
                    flood-color="#3D4552" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="10" y="8" width="76" height="76" rx="22"
        fill="url(#body-administration)" filter="url(#drop-administration)"/>
  <rect x="10" y="8" width="76" height="38" rx="22"
        fill="url(#gloss-administration)"/>
  <circle cx="48" cy="46" r="16" fill="none" stroke="#0B3A42"
          stroke-opacity="0.3" stroke-width="8" stroke-dasharray="6.28 6.28"
          transform="translate(0,3)"/>
  <circle cx="48" cy="46" r="16" fill="none" stroke="#FFFFFF"
          stroke-width="8" stroke-dasharray="6.28 6.28"/>
  <circle cx="48" cy="46" r="7" fill="#3D4552"/>
</svg>
