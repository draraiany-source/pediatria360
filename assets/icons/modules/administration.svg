<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"
     width="96" height="96" role="img" aria-label="administration">
  <defs>
    <linearGradient id="body-administration" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B7686"/>
      <stop offset="100%" stop-color="#3D4552"/>
    </linearGradient>
    <linearGradient id="gloss-administration" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
