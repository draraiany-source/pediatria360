name: pediatria360
description: "Master Kit Pediatria 360 - plataforma para pais, medicos e equipes pediatricas."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado / DI
  flutter_riverpod: ^2.6.1

  # Navegacao
  go_router: ^14.6.2

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.7
  cloud_functions: ^5.1.5
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.2.0
  firebase_remote_config: ^5.1.6
  firebase_app_check: ^0.3.2+1
  google_sign_in: ^6.2.2

  # Rede
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Persistencia local (Offline First)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  lottie: ^3.1.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  fl_chart: ^0.69.2
  intl: ^0.20.2

  # Media / upload
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Utilidades
  equatable: ^2.0.7
  uuid: ^4.5.1
  crypto: ^3.0.6

  # Geracao e impressao de documentos clinicos.
  pdf: ^3.11.1
  printing: ^5.13.4
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/modules/
    - assets/icons/navigation/
    - assets/icons/patients/
    - assets/icons/medical-record/
    - assets/icons/schedule/
    - assets/icons/vaccines/
    - assets/icons/telemedicine/
    - assets/icons/messages/
    - assets/icons/ai/
    - assets/icons/neurology/
    - assets/icons/family/
    - assets/icons/finance/
    - assets/icons/reports/
    - assets/icons/documents/
    - assets/icons/actions/
    - assets/icons/alerts/
    - assets/icons/library/
    - assets/icons/alternatives/
    - assets/icons/Pediatria360_Icones_Premium/
    - assets/icons/Pediatria360_Icones_Premium/icones/
    - assets/illustrations/
    - assets/illustrations/capi/
    - assets/illustrations/avatars/
    - assets/lottie/
    - assets/data/
